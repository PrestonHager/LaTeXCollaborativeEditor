[package]
name = "latex-collaborative-editor"
# Not the app's version. tauri.conf.json reads frontend/package.json's, which the release flow
# bumps, so this placeholder never needs a release commit (docs/desktop.md, "Versions").
version = "0.0.0"
description = "Native desktop shell for the LaTeX Collaborative Editor"
license = "GPL-3.0-or-later"
repository = "https://github.com/PrestonHager/LaTeXCollaborativeEditor"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The _lib suffix keeps the lib and bin names apart, which Cargo on Windows needs.
name = "latex_collaborative_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# PKCE verifier, challenge and state for Google sign-in (src/google_auth.rs).
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
# Google sign-in through the system browser (issue #177, docs/desktop.md "Google sign-in"):
# the refresh token lives in the OS keychain (Keychain, Credential Manager, Secret Service).
keyring = "4"
# Token requests to oauth2.googleapis.com. native-tls uses the OS's TLS (OpenSSL on Linux,
# which libssl-dev already covers), so no extra build tools on Windows.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
# Folders on this computer as projects (issue #178, docs/desktop.md "Storage: local folders").
# The dialog picks a folder and adds it to the fs scope; the capability itself allows no path.
tauri-plugin-dialog = "2"
# "watch" reports edits made outside the app, which go into the conflict flow.
tauri-plugin-fs = { version = "2", features = ["watch"] }
# Opens https links in the system browser, like a room link when this window has no WebRTC
# (issue #205). The capability allows https URLs only (capabilities/main-window.json).
tauri-plugin-opener = "2"
# Keeps the folders picked in the dialog in the fs scope across restarts, so the last project reopens.
tauri-plugin-persisted-scope = "2"
# The one-shot loopback listener for the sign-in redirect. Tauri already runs on tokio.
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process"] }
# WebRTC data channels for webviews without RTCPeerConnection (issue #176, src/native_rtc.rs):
# pure Rust ICE, DTLS and SCTP, so Linux needs no extra system library. 0.17 is the stable
# async API; 0.20+ is a rewrite.
webrtc = "0.21"
# Messages for the shell WebRTC (src/native_rtc.rs).
bytes = "1"

# Local TeX Live (#264, src/local_tex.rs): stop the whole TeX process group on a timeout.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only to turn on WebKitGTK's WebRTC setting (src/lib.rs). The same major version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

# Signed app updates from GitHub Releases (issue #179, src/updates.rs). Desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "time"] }

[profile.release]
# Smaller installers. The shell is a thin wrapper, so speed of the Rust side barely matters.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
