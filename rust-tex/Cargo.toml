[package]
name = "rust-tex"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mock"]
mock = []
tectonic = ["dep:tectonic"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tectonic = { version = "0.15", optional = true, default-features = false }
wasm-bindgen = "0.2"
