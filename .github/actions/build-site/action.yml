# Builds the site (the Vite app plus the MkDocs docs) into frontend/dist.
# Used by release.yml (production, from a vX.Y.Z tag). Staging builds from the Dockerfile on Coolify.
# The calling job sets the VITE_* variables in its env from its GitHub environment
# (Production or staging), and they reach these steps from there. See docs/deployment.md.
name: Build site
description: Build the frontend and the docs into frontend/dist for one deploy environment.

inputs:
  deploy-env:
    description: production or staging. Goes in version.json as VITE_DEPLOY_ENV; staging adds the badge and noindex.
    required: true
  docs-site-url:
    description: The public docs URL (DOCS_SITE_URL). Empty uses docs-fallback-url.
    required: false
    default: ''
  docs-fallback-url:
    description: The docs URL to use when docs-site-url is empty, like https://owner.github.io/repo/docs/.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install and build the frontend
      shell: bash
      working-directory: frontend
      env:
        VITE_DEPLOY_ENV: ${{ inputs.deploy-env }}
      run: |
        npm ci
        npm run build
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-docs.txt
    - name: Build the docs (MkDocs to frontend/dist/docs)
      shell: bash
      env:
        DOCS_SITE_URL: ${{ inputs.docs-site-url }}
        DOCS_FALLBACK_URL: ${{ inputs.docs-fallback-url }}
      run: |
        set -euo pipefail
        resolved="${DOCS_SITE_URL:-$DOCS_FALLBACK_URL}"
        case "$resolved" in
          */) ;;
          *) resolved="${resolved}/" ;;
        esac
        export DOCS_SITE_URL="$resolved"
        python3 scripts/set_mkdocs_site_url.py
        pip install -r requirements-docs.txt
        mkdocs build --site-dir frontend/dist/docs
