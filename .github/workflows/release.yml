# Releases a vX.Y.Z tag: checks it, tests and builds it, deploys it to PRODUCTION (GitHub Pages)
# and makes the GitHub release. Every production deploy is a release. See docs/versioning.md.
#
# How it runs:
# - Normally tag-release.yml calls it, after it tags a merged release PR. That run is on main,
#   so the github-pages environment's default "main only" rule lets it deploy.
# - "Run workflow" on main with a tag redeploys or retries a release. Use this one when unsure.
# - Pushing a vX.Y.Z tag by hand runs it on the tag. The deploy then needs the github-pages
#   environment to allow v* tags (docs/deployment.md, one-time setup).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release and deploy to production, like v0.2.0. It must already exist and be on main.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
      VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      VITE_DOCS_BASE_URL: ${{ vars.VITE_DOCS_BASE_URL }}
      VITE_P2P_APP_ID: ${{ vars.VITE_P2P_APP_ID }}
      VITE_STUN_URL: ${{ vars.VITE_STUN_URL }}
      # Rollback switch: set the VITE_DISABLE_CSP variable to 1 to ship without the CSP meta tags.
      VITE_DISABLE_CSP: ${{ vars.VITE_DISABLE_CSP }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history, to check the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Tag not on main::$TAG isn't on main. Only tag commits that are already on main."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tag matches package.json and has CHANGELOG notes
        run: node frontend/scripts/release-notes.mjs "$TAG" > /dev/null
      - name: Test the tagged commit
        working-directory: frontend
        run: |
          npm ci
          npm run test:run
      - uses: ./.github/actions/build-site
        with:
          deploy-env: production
          docs-site-url: ${{ vars.DOCS_SITE_URL }}
          docs-fallback-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One production deploy at a time, and never cancel one halfway.
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Get the CHANGELOG notes
        run: node frontend/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A rerun (a redeploy of the same tag) keeps the release and refreshes its notes.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
