name: Test and Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Prepare release runs this on the release branch, since a PR opened by GITHUB_TOKEN
  # doesn't start pull_request workflows. Also handy to rerun the checks on any branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Print total coverage
        run: node scripts/print-coverage-totals.mjs
      # The build ends with the bundle size check, which fails when the initial load is over budget.
      - name: Build and check bundle size
        run: npm run build
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  e2e-sync:
    name: e2e-sync (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Peers meet through public relays we don't run, so a relay outage can fail this job.
    # Keep it non-blocking and check the report when it goes red.
    continue-on-error: true
    timeout-minutes: 20
    # One job per Playwright project, so each browser reports on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browsers: chromium
          - project: firefox
            browsers: firefox
          - project: webkit
            browsers: webkit
          - project: chromium-host-firefox-guest
            browsers: chromium firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps ${{ matrix.browsers }}
        working-directory: e2e
      - name: Run two-browser sync test
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            e2e/playwright-report
            e2e/test-results
