# Every push to main deploys to the STAGING site. Production only deploys from a vX.Y.Z tag
# (release.yml). See docs/deployment.md, "Staging and production".
#
# Staging has to be on its own origin, so it shares no localStorage, IndexedDB or OAuth origin
# with production. GitHub Pages has one site per repo, so this pushes the built site to the
# gh-pages branch of a second repo (vars.STAGING_REPO, like PrestonHager/LaTeXCollaborativeEditor-staging)
# with a fine-grained token (secrets.STAGING_DEPLOY_TOKEN). Without both, the job is skipped with a notice.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters on staging.
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.config.outputs.url }}
    env:
      # From the staging environment (or the repository, if the environment doesn't set them).
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
      VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      VITE_DOCS_BASE_URL: ${{ vars.VITE_DOCS_BASE_URL }}
      # The build always gives staging an app id with "staging" in it, so its peers never meet production's.
      VITE_P2P_APP_ID: ${{ vars.VITE_P2P_APP_ID }}
      VITE_STUN_URL: ${{ vars.VITE_STUN_URL }}
      VITE_DISABLE_CSP: ${{ vars.VITE_DISABLE_CSP }}
    steps:
      - name: Check the staging repo and token are set up
        id: config
        env:
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          HAS_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_REPO" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice title=Staging deploy skipped::Set the STAGING_REPO variable and the STAGING_DEPLOY_TOKEN secret (staging environment) to deploy main to staging. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$STAGING_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Bad STAGING_REPO::STAGING_REPO must look like owner/repo, got '$STAGING_REPO'."
            exit 1
          fi
          if [ "$STAGING_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::error title=Bad STAGING_REPO::STAGING_REPO must be a different repo from this one, or staging would share production's origin."
            exit 1
          fi
          if [ -n "$STAGING_DOMAIN" ]; then
            url="https://${STAGING_DOMAIN}/"
          else
            url="https://${STAGING_REPO%%/*}.github.io/${STAGING_REPO#*/}/"
          fi
          {
            echo "ready=true"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          # The push below uses its own token, so don't leave this repo's token in git config.
          persist-credentials: false

      - if: steps.config.outputs.ready == 'true'
        uses: ./.github/actions/build-site
        with:
          deploy-env: staging
          docs-site-url: ${{ vars.DOCS_SITE_URL }}
          docs-fallback-url: ${{ steps.config.outputs.url }}docs/

      - name: Push the site to the staging repo
        if: steps.config.outputs.ready == 'true'
        env:
          STAGING_REPO: ${{ vars.STAGING_REPO }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/staging-site"
          rm -rf "$site"
          cp -R frontend/dist "$site"
          # Serve files as they are (no Jekyll), and keep the custom domain, which Pages reads from CNAME.
          touch "$site/.nojekyll"
          if [ -n "$STAGING_DOMAIN" ]; then
            echo "$STAGING_DOMAIN" > "$site/CNAME"
          fi
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} to staging"
          # One commit, force-pushed, so the staging repo doesn't grow with every deploy.
          git push --force --quiet "https://x-access-token:${STAGING_DEPLOY_TOKEN}@github.com/${STAGING_REPO}.git" gh-pages
          echo "::notice title=Staging deployed::${GITHUB_SHA::7} is on its way to ${{ steps.config.outputs.url }} (Pages in ${STAGING_REPO} publishes it in a minute or two)."
