name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_P2P_APP_ID: ${{ vars.VITE_P2P_APP_ID }}
          VITE_STUN_URL: ${{ vars.VITE_STUN_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build documentation (MkDocs → frontend/dist/docs)
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          set -euo pipefail
          resolved="${DOCS_SITE_URL:-}"
          if [ -z "$resolved" ]; then
            resolved="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/"
          fi
          case "$resolved" in
            */) ;;
            *) resolved="${resolved}/" ;;
          esac
          export DOCS_SITE_URL="$resolved"
          python3 scripts/set_mkdocs_site_url.py
          pip install -r requirements-docs.txt
          mkdocs build --site-dir frontend/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
