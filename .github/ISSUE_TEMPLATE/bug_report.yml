name: Bug report
description: Something in the editor is broken or acting weird.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Please search the existing issues first so we don't end up with duplicates.
        Don't paste tokens, API keys, or private document contents in here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open a new document
        2. Share the room link with a second browser
        3. Type in both at once
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the editor does this touch? Pick your best guess.
      options:
        - Collaboration (P2P sync, rooms)
        - Storage (local saving, autosave, Google Drive)
        - Sign-in (Google account)
        - Preview (LaTeX rendering, diagnostics)
        - Editor (typing, undo, shortcuts)
        - UI (menus, layout, accessibility)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Hosted site (latex.prestonhager.com)
        - Local dev server
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 132 on Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Anything from the browser dev tools console helps a lot. This will be formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Number of peers in the room, document size, a minimal LaTeX snippet, etc.
    validations:
      required: false
