site_name: LaTeX Collaborative Editor
# Production URL set in CI (DOCS_SITE_URL). Local default for `mkdocs serve`.
site_url: !ENV [DOCS_SITE_URL, "http://127.0.0.1:8000/"]
docs_dir: docs
site_dir: site
use_directory_urls: true

# Contributor / repo-only Markdown stays in git but is not published on the user docs site.
exclude_docs: |
  README.md
  site-plan.md
  dod-checklist.md
  protocol.md
  deployment.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.tabs
    - search.suggest
    - search.highlight
  palette:
    primary: blue
    accent: light-blue

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Editing & preview: editing-and-preview.md
  - Sharing & collaboration: collaboration.md
  - Saving & storage: saving-and-storage.md
  - Interface & layout: interface-layout.md
  - Keyboard shortcuts: keyboard-shortcuts.md
  - Search: search.md
