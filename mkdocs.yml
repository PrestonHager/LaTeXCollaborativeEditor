site_name: LaTeX Collaborative Editor
# Local `mkdocs serve` default. GitHub Pages sets canonical URL via scripts/set_mkdocs_site_url.py + DOCS_SITE_URL in CI.
site_url: "http://127.0.0.1:8000/"
docs_dir: docs
site_dir: site
use_directory_urls: true

hooks:
  - mkdocs_fuse_search_index.py

# Contributor / repo-only Markdown stays in git but is not published on the user docs site.
exclude_docs: |
  README.md
  site-plan.md
  dod-checklist.md
  protocol.md
  deployment.md
  versioning.md
  qa-runbook.md
  ui-sizing.md
  licensing.md
  assets/ui-sizing/

theme:
  name: material
  features:
    - navigation.top
    - navigation.tabs
    - search.suggest
    - search.highlight
  # Light and dark schemes, so screenshots can use #only-light and #only-dark.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  # Mermaid diagrams render from ```mermaid fences. Material loads Mermaid itself.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it fits together: how-it-fits.md
  - Projects & files: projects.md
  - Editing & preview: editing-and-preview.md
  - Sharing & collaboration: collaboration.md
  - Saving & storage: saving-and-storage.md
  - Interface & layout: interface-layout.md
  - Keyboard shortcuts: keyboard-shortcuts.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Status & error messages: messages.md
      - What's supported: whats-supported.md
      - FAQ: faq.md
  - Search: search.md
