server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The update prompt checks these after a deploy, so never serve a stale copy.
    location ~ ^/(index\.html|version\.json|CHANGELOG\.md)$ {
        add_header Cache-Control "no-cache";
    }

    # Hashed Vite assets never change, so cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
