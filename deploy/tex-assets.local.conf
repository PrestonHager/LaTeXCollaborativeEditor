# Compile PDF engine files served from this image's tex/ folder (the default, and what static
# hosting does). A missing file is a real 404, not index.html.
#
# Every file is under a versioned, content-hashed path (docs/wasm-tex-engine.md), so browsers may
# keep it forever. Only the manifest changes in place, so it's always revalidated.
location = /tex/manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

location /tex/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
